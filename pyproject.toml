[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-firewall-trm"
version = "0.2.0"
description = "Local DNS risk engine: threat-intel matching, anomaly scoring, and Pi-hole blocklist export."
requires-python = ">=3.10"

[project.scripts]
ghost-firewall = "ai_firewall.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
